<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>钢铁洪流 · 坦克大战</title>
<style>
  :root {
    --bg: #0b0e13;
    --panel: #141a24;
    --accent: #57e6a6;
    --accent2: #4fc3f7;
    --gold: #ffd54f;
    --danger: #ff5f56;
    --text: #e8eef5;
    --muted: #8b98a9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(1200px 700px at 50% -10%, #16202e 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #wrap {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
  }
  h1 {
    font-size: 20px; letter-spacing: 3px; font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase;
  }
  #stage {
    position: relative;
    width: min(100vw - 24px, 96vh, 640px);
    aspect-ratio: 16 / 13;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
    overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; background: #0d1117; }
  .hud {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .chip {
    background: var(--panel); border: 1px solid rgba(255,255,255,.08);
    border-radius: 10px; padding: 8px 14px; display: flex; align-items: center; gap: 8px;
    min-width: 92px; justify-content: center;
  }
  .chip .k { color: var(--muted); font-weight: 500; }
  .chip .v { color: var(--gold); font-variant-numeric: tabular-nums; }
  .hint { color: var(--muted); font-size: 12px; letter-spacing: 1px; }
  /* touch controls */
  #touch {
    display: none; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px);
    gap: 6px; margin-top: 4px;
  }
  .tbtn {
    border-radius: 12px; background: var(--panel); border: 1px solid rgba(255,255,255,.1);
    color: var(--text); font-size: 22px; display: flex; align-items: center; justify-content: center;
    touch-action: none; cursor: pointer;
  }
  .tbtn:active, .tbtn.active { background: var(--accent); color: #06271a; }
  #t-up { grid-column: 2; grid-row: 1; }
  #t-left { grid-column: 1; grid-row: 2; }
  #t-fire { grid-column: 2; grid-row: 2; background: #3a1d20; border-color: rgba(255,95,86,.4); }
  #t-fire:active { background: var(--danger); color: #fff; }
  #t-right { grid-column: 3; grid-row: 2; }
  #t-down { grid-column: 2; grid-row: 3; }
  @media (pointer: coarse) { #touch { display: grid; } }
</style>
</head>
<body>
<div id="wrap">
  <h1>钢铁洪流 · Tank Battle</h1>
  <div id="stage">
    <canvas id="game" width="640" height="520"></canvas>
  </div>
  <div class="hud">
    <div class="chip"><span class="k">分数</span><span class="v" id="score">0</span></div>
    <div class="chip"><span class="k">波次</span><span class="v" id="wave">1</span></div>
    <div class="chip"><span class="k">生命</span><span class="v" id="lives">3</span></div>
    <div class="chip"><span class="k">敌人</span><span class="v" id="enemies">0</span></div>
  </div>
  <div class="hint">WASD / 方向键 移动 · 空格 射击 · P 暂停</div>
  <div id="touch">
    <button class="tbtn" id="t-up">▲</button>
    <button class="tbtn" id="t-left">◀</button>
    <button class="tbtn" id="t-fire">◉</button>
    <button class="tbtn" id="t-right">▶</button>
    <button class="tbtn" id="t-down">▼</button>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   钢铁洪流 · Tank Battle —— 原创 Canvas 坦克对战
   ============================================================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---- 网格常量 ----
const CELL = 40;                 // 一个格子的像素
const COLS = W / CELL;           // 16
const ROWS = H / CELL;           // 13
const TILE = { EMPTY:0, BRICK:1, STEEL:2, TREE:3, WATER:4, BASE:5 };

// ---- 方向 ----
const DIR = {
  UP:    { x: 0,  y: -1 },
  DOWN:  { x: 0,  y:  1 },
  LEFT:  { x: -1, y:  0 },
  RIGHT: { x: 1,  y:  0 },
};
const DIRS = [DIR.UP, DIR.RIGHT, DIR.DOWN, DIR.LEFT]; // 顺时针，用于旋转角
const dirIndex = d => DIRS.findIndex(v => v === d);
const rotateCW  = d => DIRS[(dirIndex(d) + 1) % 4];
const rotateCCW = d => DIRS[(dirIndex(d) + 3) % 4];
const randomDir = () => DIRS[Math.floor(Math.random() * 4)];

// ---- 关卡地图（16 x 13）----
function buildLevel(n) {
  const g = Array.from({ length: ROWS }, () => Array(COLS).fill(TILE.EMPTY));
  // 外围钢墙
  for (let x = 0; x < COLS; x++) { g[0][x] = TILE.STEEL; g[ROWS-1][x] = TILE.STEEL; }
  for (let y = 0; y < ROWS; y++) { g[y][0] = TILE.STEEL; g[y][COLS-1] = TILE.STEEL; }
  // 基地（底部中央，周围砖墙保护）
  const bx = Math.floor(COLS / 2), by = ROWS - 2;
  g[by][bx] = TILE.BASE; g[by][bx-1] = TILE.BASE;
  for (let x = bx - 2; x <= bx + 1; x++) { if (g[by+0][x] !== TILE.BASE) g[by+0][x] = TILE.BRICK; g[by-1][x] = TILE.BRICK; }
  // 砖块图案（随波次加厚）
  const patterns = [
    [[2,2],[3,2],[4,2],[10,2],[11,2],[12,2],[2,4],[5,4],[8,4],[11,4],[3,6],[6,6],[9,6],[12,6],[6,8],[9,8],[4,10],[8,10],[11,10]],
    [[2,2],[3,2],[4,2],[5,2],[8,2],[9,2],[10,2],[11,2],[2,4],[5,4],[8,4],[11,4],[4,5],[7,5],[10,5],[3,7],[6,7],[9,7],[12,7],[6,9],[9,9],[3,10],[5,10],[11,10]],
    [[3,2],[5,2],[8,2],[10,2],[2,3],[6,3],[10,3],[13,3],[3,5],[9,5],[13,5],[5,7],[10,7],[2,9],[7,9],[12,9],[4,10],[9,10],[11,10]],
  ];
  const p = patterns[Math.min(n - 1, patterns.length - 1)];
  for (const [x, y] of p) if (x >= 0 && x < COLS && y >= 0 && y < ROWS && g[y][x] === TILE.EMPTY) g[y][x] = TILE.BRICK;
  // 钢块散点
  const steels = [[4,4],[11,4],[7,6],[2,7],[13,7],[4,9],[11,9]];
  for (const [x, y] of steels) if (g[y][x] === TILE.EMPTY) g[y][x] = TILE.STEEL;
  // 树林（可通行，遮蔽视线）
  const trees = [[1,1],[2,1],[6,1],[13,1],[7,3],[8,3],[7,4],[8,4],[1,6],[14,6],[6,10],[9,10]];
  for (const [x, y] of trees) if (g[y][x] === TILE.EMPTY) g[y][x] = TILE.TREE;
  // 水域
  const water = [[6,5],[7,5],[8,5],[6,6],[7,6],[8,6],[2,8],[13,8],[2,9],[13,9]];
  for (const [x, y] of water) if (g[y][x] === TILE.EMPTY) g[y][x] = TILE.WATER;
  return g;
}

// ---- 音效（Web Audio 合成）----
let AC = null;
function audio() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } return AC; }
function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime;
  const o = ac.createOscillator(), gn = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
  gn.gain.setValueAtTime(vol, t);
  gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn).connect(ac.destination);
  o.start(t); o.stop(t + dur);
}
const SFX = {
  shoot:   () => beep(620, 0.07, 'square', 0.05, -300),
  explode: () => beep(160, 0.28, 'sawtooth', 0.12, -120),
  hit:     () => beep(280, 0.06, 'square', 0.06),
  brick:   () => beep(220, 0.08, 'triangle', 0.08),
  spawn:   () => beep(340, 0.16, 'triangle', 0.08, 160),
  baseHit: () => { beep(140, 0.5, 'sawtooth', 0.14, -80); beep(90, 0.6, 'sawtooth', 0.1, -50); },
  win:     () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.22, 'triangle', 0.09), i * 140)); },
};

// ---- 输入 ----
const keys = {};
const touch = { up:false, down:false, left:false, right:false, fire:false };
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase())) e.preventDefault();
  if (e.key.toLowerCase() === 'p') togglePause();
});
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

// ---- 游戏状态 ----
let grid = buildLevel(1), player = null, enemies = [], bullets = [], particles = [], baseAlive = true;
let score = 0, lives = 3, wave = 1, state, spawnQueue = [], spawnTimer = 0, freeze = 0, shake = 0, paused = false;
let frame = 0;

const STATE = { MENU:0, PLAY:1, OVER:2, WIN:3, PAUSE:4 };

function resetGame() {
  grid = buildLevel(1);
  enemies = []; bullets = []; particles = [];
  score = 0; lives = 3; wave = 1; baseAlive = true;
  freeze = 0; shake = 0; paused = false;
  spawnPlayer();
  setupWave(1);
  state = STATE.PLAY;
  syncHud();
}

function setupWave(n) {
  const count = 6 + Math.min(n * 2, 14);
  spawnQueue = Array.from({ length: count }, () => 0);
  // 前几个是慢速小兵，后面随机类型
  spawnQueue = spawnQueue.map((_, i) => i < 3 ? 0 : (Math.random() < 0.3 ? 1 : Math.random() < 0.15 ? 2 : 0));
  spawnTimer = 90;
}

function spawnPlayer() {
  // 出生在基地左侧的开阔格（第 11 行、第 4 列），避开底部钢墙边界
  player = new Tank(4*CELL, (ROWS-2)*CELL, DIR.UP, 0, true);
}

// ---- 坦克对象 ----
class Tank {
  constructor(x, y, dir, type, isPlayer) {
    this.x = x; this.y = y; this.dir = dir;
    this.type = type;          // 0 普通 1 快速 2 重甲
    this.isPlayer = isPlayer;
    this.speed = (type === 1 ? 2.6 : type === 2 ? 1.3 : 2.0);
    if (isPlayer) this.speed = 2.4;
    this.hp = isPlayer ? 1 : (type === 2 ? 3 : 1);
    this.size = CELL * 0.9;
    this.cool = 0; this.fireDelay = isPlayer ? 14 : (30 + Math.random()*50);
    this.aiTimer = 0; this.aiDir = dir;
    this.spawnT = 40;          // 出生保护闪烁
  }
  get rect() { return { x: this.x + (CELL-this.size)/2, y: this.y + (CELL-this.size)/2, w: this.size, h: this.size }; }
}

function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function canMove(tank, nx, ny, ignoreBase = false) {
  const r = { x: nx + (CELL-tank.size)/2, y: ny + (CELL-tank.size)/2, w: tank.size, h: tank.size };
  // 与地图碰撞
  const c0 = Math.floor(r.x / CELL), c1 = Math.floor((r.x + r.w - 0.1) / CELL);
  const r0 = Math.floor(r.y / CELL), r1 = Math.floor((r.y + r.h - 0.1) / CELL);
  for (let rr = r0; rr <= r1; rr++) for (let cc = c0; cc <= c1; cc++) {
    if (cc < 0 || cc >= COLS || rr < 0 || rr >= ROWS) return false;
    const t = grid[rr][cc];
    if (t === TILE.BRICK || t === TILE.STEEL || t === TILE.WATER) return false;
    if (t === TILE.BASE && !ignoreBase) return false;
  }
  // 与其它坦克碰撞
  for (const t of [...enemies, player]) {
    if (t === tank || !t) continue;
    if (rectsOverlap(r, t.rect)) return false;
  }
  return true;
}

function tryMove(tank) {
  const step = tank.speed;
  let nx = tank.x, ny = tank.y;
  if (tank.dir === DIR.UP) ny -= step; else if (tank.dir === DIR.DOWN) ny += step;
  else if (tank.dir === DIR.LEFT) nx -= step; else if (tank.dir === DIR.RIGHT) nx += step;
  nx = Math.max(0, Math.min(W - CELL, nx));
  ny = Math.max(0, Math.min(H - CELL, ny));
  if (canMove(tank, nx, ny)) { tank.x = nx; tank.y = ny; return true; }
  // 对齐到网格，便于转弯
  if (tank.dir === DIR.UP || tank.dir === DIR.DOWN) tank.x = Math.round(tank.x / 4) * 4;
  else tank.y = Math.round(tank.y / 4) * 4;
  return false;
}

// ---- 子弹 ----
class Bullet {
  constructor(x, y, dir, owner, power) {
    this.x = x; this.y = y; this.dir = dir; this.owner = owner;
    this.speed = 7; this.size = 7; this.alive = true; this.power = power || 1;
  }
  rect() { return { x: this.x - this.size/2, y: this.y - this.size/2, w: this.size, h: this.size }; }
}

function fire(tank) {
  if (tank.cool > 0 || tank.spawnT > 0) return;
  const cx = tank.x + CELL/2, cy = tank.y + CELL/2;
  const b = new Bullet(cx + tank.dir.x * (CELL/2), cy + tank.dir.y * (CELL/2), tank.dir, tank);
  bullets.push(b);
  tank.cool = tank.fireDelay;
  if (tank.isPlayer) SFX.shoot(); else if (Math.random() < 0.5) SFX.shoot();
}

function bulletMove(b) {
  for (let i = 0; i < b.speed; i++) {
    b.x += b.dir.x; b.y += b.dir.y;
    if (b.x < 0 || b.x >= W || b.y < 0 || b.y >= H) { b.alive = false; break; }
    const c = Math.floor(b.x / CELL), r = Math.floor(b.y / CELL);
    const t = grid[r][c];
    if (t === TILE.BRICK) {
      grid[r][c] = TILE.EMPTY; b.alive = false; SFX.brick();
      addParticles(c*CELL+CELL/2, r*CELL+CELL/2, '#c77b3f', 8);
      break;
    } else if (t === TILE.STEEL) {
      b.alive = false; SFX.hit(); addParticles(b.x, b.y, '#9fb3c8', 5); break;
    } else if (t === TILE.BASE) {
      b.alive = false; destroyBase(); break;
    } else if (t === TILE.WATER) { b.alive = false; /* 子弹入水 */ break; }
    // 命中坦克
    for (const tank of enemies) {
      if (tank.spawnT <= 0 && rectsOverlap(b.rect(), tank.rect) && b.owner !== tank) {
        tank.hp -= b.power; b.alive = false; SFX.hit();
        if (tank.hp <= 0) killTank(tank);
        break;
      }
    }
    if (!b.alive) break;
    if (player && b.owner !== player && player.spawnT <= 0 && rectsOverlap(b.rect(), player.rect)) {
      b.alive = false; killPlayer(); break;
    }
  }
}

function killTank(t) {
  const idx = enemies.indexOf(t);
  if (idx >= 0) enemies.splice(idx, 1);
  addExplosion(t.x + CELL/2, t.y + CELL/2);
  score += t.type === 2 ? 300 : t.type === 1 ? 200 : 100;
  SFX.explode(); shake = Math.max(shake, 6);
  syncHud();
}

function killPlayer() {
  if (freeze > 0) return;
  addExplosion(player.x + CELL/2, player.y + CELL/2);
  SFX.explode(); shake = Math.max(shake, 10);
  lives--; syncHud();
  if (lives <= 0) { state = STATE.OVER; return; }
  freeze = 60;
  player = new Tank(COLS/2*CELL - CELL/2, ROWS*CELL - CELL, DIR.UP, 0, true);
}

function destroyBase() {
  if (!baseAlive) return;
  baseAlive = false; SFX.baseHit(); shake = 18;
  addExplosion(COLS/2*CELL, (ROWS-2)*CELL, true);
  const bx = Math.floor(COLS/2), by = ROWS-2;
  grid[by][bx] = TILE.EMPTY; grid[by][bx-1] = TILE.EMPTY;
  state = STATE.OVER;
}

// ---- 粒子 ----
function addParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({ x, y, vx: (Math.random()-0.5)*3, vy: (Math.random()-0.5)*3, life: 20+Math.random()*15, color, size: 2+Math.random()*3 });
  }
}
function addExplosion(x, y, big) {
  const n = big ? 60 : 24;
  const colors = ['#ffd54f', '#ff8f3f', '#ff5f56', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1 + Math.random() * (big ? 5 : 3);
    particles.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, life: 25+Math.random()*20, color: colors[Math.floor(Math.random()*colors.length)], size: 2+Math.random()*4 });
  }
}

// ---- 敌方 AI ----
function enemyAI(t) {
  t.aiTimer--;
  t.cool--;
  if (t.spawnT > 0) return;
  // 朝向玩家或基地的简单追踪 + 随机转向
  if (t.aiTimer <= 0) {
    t.aiTimer = 40 + Math.floor(Math.random() * 60);
    const roll = Math.random();
    if (roll < 0.5) {
      // 朝玩家方向
      const dx = player.x - t.x, dy = player.y - t.y;
      t.aiDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? DIR.RIGHT : DIR.LEFT) : (dy > 0 ? DIR.DOWN : DIR.UP);
    } else if (roll < 0.8) {
      t.aiDir = randomDir();
    } else {
      t.aiDir = Math.random() < 0.5 ? rotateCW(t.aiDir) : rotateCCW(t.aiDir);
    }
  }
  // 前方有障碍或随机决定开火
  const ahead = { x: t.x + t.aiDir.x * CELL, y: t.y + t.aiDir.y * CELL };
  const blocked = !canMove(t, ahead.x, ahead.y);
  if (blocked) t.aiDir = randomDir();
  else t.dir = t.aiDir;
  tryMove(t);
  // 开火
  if (Math.random() < 0.03 || (blocked && Math.random() < 0.3)) fire(t);
}

// ---- 更新 ----
function update() {
  if (state !== STATE.PLAY || paused) return;
  frame++;
  if (freeze > 0) freeze--;
  if (shake > 0) shake = Math.max(0, shake - 0.5);

  // 玩家移动
  if (player) {
    player.cool--;
    let d = null;
    if (keys['w'] || keys['arrowup'] || touch.up) d = DIR.UP;
    else if (keys['s'] || keys['arrowdown'] || touch.down) d = DIR.DOWN;
    else if (keys['a'] || keys['arrowleft'] || touch.left) d = DIR.LEFT;
    else if (keys['d'] || keys['arrowright'] || touch.right) d = DIR.RIGHT;
    if (d) { player.dir = d; tryMove(player); }
    if (keys[' '] || touch.fire) fire(player);
  }

  // 敌人 AI
  for (const t of enemies) { if (t.spawnT > 0) t.spawnT--; else enemyAI(t); }

  // 出生
  if (spawnQueue.length && spawnTimer-- <= 0) {
    const type = spawnQueue.shift();
    const spawns = [[1,1],[COLS-2,1],[1,ROWS-3],[COLS-2,ROWS-3]];
    const [sx, sy] = spawns[Math.floor(Math.random() * spawns.length)];
    const t = new Tank(sx*CELL, sy*CELL, DIR.DOWN, type, false);
    enemies.push(t);
    SFX.spawn();
    addParticles(sx*CELL+CELL/2, sy*CELL+CELL/2, '#57e6a6', 12);
    spawnTimer = 160 - Math.min(wave*8, 80);
  }

  // 子弹
  for (const b of bullets) if (b.alive) bulletMove(b);
  bullets = bullets.filter(b => b.alive);

  // 粒子
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  // 波次推进
  if (spawnQueue.length === 0 && enemies.length === 0 && state === STATE.PLAY) {
    if (wave >= 8) { state = STATE.WIN; SFX.win(); }
    else { wave++; setupWave(wave); syncHud(); freeze = Math.max(freeze, 40); SFX.spawn(); }
  }
  syncHud();
}

function syncHud() {
  document.getElementById('score').textContent = score;
  document.getElementById('wave').textContent = wave;
  document.getElementById('lives').textContent = lives;
  document.getElementById('enemies').textContent = enemies.length + spawnQueue.length;
}

// ---- 渲染 ----
function drawTile(x, y, t) {
  const px = x * CELL, py = y * CELL;
  switch (t) {
    case TILE.BRICK: {
      ctx.fillStyle = '#8a4a2b';
      ctx.fillRect(px, py, CELL, CELL);
      ctx.fillStyle = '#a85c36';
      ctx.fillRect(px, py, CELL, CELL/2);
      ctx.fillRect(px, py, CELL/2, CELL);
      ctx.strokeStyle = 'rgba(0,0,0,.25)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= CELL; i += CELL/2) { ctx.beginPath(); ctx.moveTo(px+i, py); ctx.lineTo(px+i, py+CELL); ctx.stroke(); ctx.beginPath(); ctx.moveTo(px, py+i); ctx.lineTo(px+CELL, py+i); ctx.stroke(); }
      break;
    }
    case TILE.STEEL: {
      ctx.fillStyle = '#2a3644';
      ctx.fillRect(px, py, CELL, CELL);
      ctx.fillStyle = '#8ea3b8';
      ctx.fillRect(px+4, py+4, CELL-8, CELL-8);
      ctx.fillStyle = '#c2d3e2';
      ctx.fillRect(px+7, py+7, CELL-14, CELL-14);
      ctx.fillStyle = '#5f7286';
      ctx.fillRect(px+10, py+10, CELL-20, CELL-20);
      break;
    }
    case TILE.TREE: {
      ctx.fillStyle = '#1c2a1e';
      ctx.fillRect(px, py, CELL, CELL);
      ctx.fillStyle = '#2f6b3a';
      for (let i = 0; i < 4; i++) { ctx.beginPath(); ctx.arc(px+8+i*8, py+10+(i%2)*8, 9, 0, Math.PI*2); ctx.fill(); }
      ctx.fillStyle = '#4aa65a';
      ctx.beginPath(); ctx.arc(px+16, py+20, 8, 0, Math.PI*2); ctx.fill();
      break;
    }
    case TILE.WATER: {
      ctx.fillStyle = '#12314f';
      ctx.fillRect(px, py, CELL, CELL);
      ctx.fillStyle = '#1c4d7a';
      const off = (frame + x + y) % 2;
      for (let i = 0; i < 3; i++) ctx.fillRect(px + (i*14 + (off?4:0)) % CELL, py + (i*12 + (off?6:0)) % CELL, 18, 3);
      break;
    }
    case TILE.BASE: {
      ctx.fillStyle = baseAlive ? '#3a1d20' : '#111';
      ctx.fillRect(px, py, CELL, CELL);
      if (baseAlive) {
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath(); ctx.moveTo(px+8, py+30); ctx.lineTo(px+20, py+8); ctx.lineTo(px+32, py+30); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ff5f56';
        ctx.fillRect(px+18, py+30, 4, 10);
      } else {
        ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(px+20, py+20, 12, 0, Math.PI*2); ctx.fill();
      }
      break;
    }
  }
}

function drawTank(t) {
  // 出生保护闪烁
  if (t.spawnT > 0 && (Math.floor(t.spawnT / 4) % 2 === 0)) return;
  const r = t.rect;
  const cx = r.x + r.w/2, cy = r.y + r.h/2;
  ctx.save();
  ctx.translate(cx, cy);
  const idx = dirIndex(t.dir);
  ctx.rotate(idx * Math.PI / 2);
  const s = t.size;
  const bodyColor = t.isPlayer ? '#57e6a6' : (t.type === 2 ? '#ff8f3f' : t.type === 1 ? '#ffd54f' : '#ff5f56');
  const darkColor = t.isPlayer ? '#2c8a63' : (t.type === 2 ? '#b35c1f' : t.type === 1 ? '#b8902c' : '#b33a30');
  // 履带
  ctx.fillStyle = darkColor;
  ctx.fillRect(-s/2, -s/2, s/4, s);
  ctx.fillRect(s/4, -s/2, s/4, s);
  ctx.fillStyle = '#111';
  for (let i = -s/2 + 2; i < s/2; i += 5) { ctx.fillRect(-s/2, i, s/4, 2); ctx.fillRect(s/4, i, s/4, 2); }
  // 车身
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-s/2 + s/4, -s/2 + s/6, s/2, s - s/3);
  // 炮塔
  ctx.fillStyle = bodyColor;
  ctx.beginPath(); ctx.arc(0, 0, s/3.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = darkColor;
  ctx.beginPath(); ctx.arc(0, 0, s/5, 0, Math.PI*2); ctx.fill();
  // 炮管
  ctx.fillStyle = darkColor;
  ctx.fillRect(-s/14, -s/2, s/7, s/2);
  ctx.restore();
  // 血条（重甲敌人）
  if (!t.isPlayer && t.hp > 1) {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(r.x, r.y - 6, r.w, 4);
    ctx.fillStyle = '#57e6a6'; ctx.fillRect(r.x, r.y - 6, r.w * (t.hp/3), 4);
  }
}

function render() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  // 地图
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = grid[y][x];
    if (t !== TILE.EMPTY && t !== TILE.TREE) drawTile(x, y, t);
  }
  // 子弹
  for (const b of bullets) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffe082';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.size/3, 0, Math.PI*2); ctx.fill();
  }
  // 坦克
  for (const t of enemies) drawTank(t);
  if (player) drawTank(player);
  // 树木（覆盖在坦克之上，形成遮蔽）
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[y][x] === TILE.TREE) drawTile(x, y, TILE.TREE);
  // 粒子
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // 覆盖层
  drawOverlay();
}

function drawOverlay() {
  ctx.fillStyle = 'rgba(6,10,16,.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state === STATE.MENU) {
    ctx.fillStyle = '#57e6a6';
    ctx.font = 'bold 46px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('钢铁洪流', W/2, H/2 - 70);
    ctx.fillStyle = '#4fc3f7';
    ctx.font = 'bold 22px "Segoe UI",sans-serif';
    ctx.fillText('TANK BATTLE', W/2, H/2 - 24);
    ctx.fillStyle = '#e8eef5';
    ctx.font = '18px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('守住你的基地，消灭所有来犯之敌', W/2, H/2 + 40);
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 20px "Segoe UI","Microsoft YaHei",sans-serif';
    if (Math.floor(frame/30) % 2 === 0) ctx.fillText('按 空格 开始', W/2, H/2 + 100);
    ctx.fillStyle = '#8b98a9';
    ctx.font = '13px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('WASD/方向键移动 · 空格射击 · P暂停', W/2, H/2 + 140);
  } else if (state === STATE.OVER) {
    ctx.fillStyle = '#ff5f56';
    ctx.font = 'bold 44px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText(baseAlive ? '任务失败' : '基地被毁', W/2, H/2 - 60);
    ctx.fillStyle = '#e8eef5';
    ctx.font = '22px "Segoe UI",sans-serif';
    ctx.fillText('最终得分 ' + score, W/2, H/2);
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 18px "Segoe UI","Microsoft YaHei",sans-serif';
    if (Math.floor(frame/30) % 2 === 0) ctx.fillText('按 空格 重新开始', W/2, H/2 + 60);
  } else if (state === STATE.WIN) {
    ctx.fillStyle = '#57e6a6';
    ctx.font = 'bold 44px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('胜利！', W/2, H/2 - 60);
    ctx.fillStyle = '#e8eef5';
    ctx.font = '22px "Segoe UI",sans-serif';
    ctx.fillText('你守住了基地 · 得分 ' + score, W/2, H/2);
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 18px "Segoe UI","Microsoft YaHei",sans-serif';
    if (Math.floor(frame/30) % 2 === 0) ctx.fillText('按 空格 再来一局', W/2, H/2 + 60);
  } else if (state === STATE.PAUSE) {
    ctx.fillStyle = '#ffd54f';
    ctx.font = 'bold 40px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('已暂停', W/2, H/2);
    ctx.fillStyle = '#8b98a9';
    ctx.font = '16px "Segoe UI","Microsoft YaHei",sans-serif';
    ctx.fillText('按 P 继续', W/2, H/2 + 46);
  }
}

function togglePause() {
  if (state === STATE.PLAY) { state = STATE.PAUSE; paused = true; }
  else if (state === STATE.PAUSE) { state = STATE.PLAY; paused = false; }
}

// ---- 主循环 ----
function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// ---- 触屏控件 ----
function bindTouch(id, key) {
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[key] = true; el.classList.add('active'); };
  const off = e => { e.preventDefault(); touch[key] = false; el.classList.remove('active'); };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
  el.addEventListener('mousedown', on);
  el.addEventListener('mouseup', off);
  el.addEventListener('mouseleave', off);
}
bindTouch('t-up', 'up'); bindTouch('t-down', 'down');
bindTouch('t-left', 'left'); bindTouch('t-right', 'right');
bindTouch('t-fire', 'fire');

// ---- 启动 ----
state = STATE.MENU;
addEventListener('keydown', e => {
  if (e.key === ' ') {
    e.preventDefault();
    if (state === STATE.MENU) { resetGame(); }
    else if (state === STATE.OVER || state === STATE.WIN) { state = STATE.MENU; }
  }
});
// 点击开始（触屏）
canvas.addEventListener('click', () => {
  if (state === STATE.MENU) resetGame();
  else if (state === STATE.OVER || state === STATE.WIN) state = STATE.MENU;
});
loop();
</script>
